name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask requests beautifulsoup4 openpyxl lxml gunicorn pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller `
            --noconfirm `
            --onefile `
            --name "TrafficTracker" `
            --add-data "templates;templates" `
            --add-data "static;static" `
            --hidden-import flask `
            --hidden-import requests `
            --hidden-import bs4 `
            --hidden-import openpyxl `
            --hidden-import lxml `
            --hidden-import lxml.etree `
            --hidden-import lxml._elementpath `
            --hidden-import jinja2 `
            --hidden-import werkzeug `
            --hidden-import click `
            --hidden-import itsdangerous `
            launcher.py

      - name: Verify build
        run: |
          dir dist\
          echo "EXE size (MB):"
          (Get-Item dist\TrafficTracker.exe).length / 1MB

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrafficTracker-Windows
          path: dist/TrafficTracker.exe
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "TrafficTracker v1.0.${{ github.run_number }}"
          body: |
            ## 📊 Traffic Tracker — Windows EXE

            ### Как использовать:
            1. Скачайте `TrafficTracker.exe`
            2. Дважды кликните по файлу
            3. Откроется браузер на `http://127.0.0.1:8080`
          files: dist/TrafficTracker.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
